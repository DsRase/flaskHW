global:
  scrape_interval: 15s

scrape_configs:    
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.31.103:9100'] # ВОТ ТУТ ЗАМЕНИТь IP

  - job_name: 'flask_app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres_exporter:9187']