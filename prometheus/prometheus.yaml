global:
  scrape_interval: 15s

scrape_configs:    
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'flask_app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres_exporter:9187']