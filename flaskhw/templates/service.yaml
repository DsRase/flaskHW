apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
  - port: 80
    targetPort: 80
    nodePort: {{ .Values.service.nodePort | default 30080 }}
  type: {{ .Values.service.type | default "NodePort" }}