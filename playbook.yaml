---
- hosts: vm
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      args:
        creates: /usr/local/bin/kubectl

    - name: Install Minikube
      shell: |
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        install minikube-linux-amd64 /usr/local/bin/minikube
      args:
        creates: /usr/local/bin/minikube

    - name: Start Minikube
      shell: |
        sudo -u {{ ansible_user }} minikube start --driver=docker
      become: true

    - name: Copy flaskhw directory (для Helm)
      copy:
        src: flaskhw/
        dest: /tmp/flaskhw/
        mode: preserve      

    - name: Copy config files
      copy:
        src: "{{ item }}"
        dest: /tmp/
        mode: '0755'
      loop:
        - argocd/
        - playbook.yaml
    
    - name: Copy DB infrastructure
      copy:
        src: "{{ item }}"
        dest: /tmp/
      loop:
        - flaskhw/flaskhw-postgres-statefulset.yaml
        - flaskhw/flaskhw-redis.yaml
        - flaskhw/flaskhw-configmap.yaml

    - name: Fix Minikube kubectl context
      shell: minikube update-context
      become: false
      become_user: "{{ ansible_user }}"

    - name: Install Helm
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
      become: true
    
    - name: Deploy Postgres + Redis (docker-compose → K8s)
      shell: |
        kubectl apply -f /tmp/flaskhw-postgres-statefulset.yaml
        kubectl apply -f /tmp/flaskhw-redis.yaml
        kubectl apply -f /tmp/flaskhw-configmap.yaml
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Wait for DB ready
      shell: kubectl wait --for=condition=ready pod -l app=postgres -n flaskhw --timeout=120s
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Link ConfigMap to Flask
      shell: kubectl set env deployment/flaskhw --from=configmap/flaskhw-config -n flaskhw
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    # - name: Restart Flask
    #   shell: kubectl rollout restart deployment/flaskhw -n flaskhw
    #   environment:
    #     KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Create flaskhw namespace
      shell: kubectl create namespace flaskhw || true
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Deploy Flask via Helm (clean install)
      shell: |
        helm uninstall flaskhw -n flaskhw || true
        helm install flaskhw /tmp/flaskhw --namespace flaskhw
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Wait for Flask deployment ready
      shell: kubectl rollout status deployment/flaskhw -n flaskhw --timeout=300s
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config

    - name: Show Flask service URL
      shell: minikube service flaskhw-service --url -n flaskhw
      become_user: "{{ ansible_user }}"
      register: service_url

    - name: FINAL SUCCESS
      debug:
        msg: "Link: {{ service_url.stdout }}"